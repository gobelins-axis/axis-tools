<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axis Tools</title>
    <script>
        // The launcher preload looks for window.__axis__ at DOMContentLoaded. The
        // real object is created when the module below runs; this shim keeps the
        // ipcRenderer if the preload gets there first (see src/shared/axis.js).
        window.__axis__ = {
            set_ipc_renderer: function (ipcRenderer) { window.__axis_pending_ipc__ = ipcRenderer; },
        };
    </script>
</head>
<body>
    <div class="layout">
        <header class="header">
            <img class="logo" src="/icons/logo.svg" alt="Axis">
            <span class="tag tag--dim js-source"></span>
        </header>

        <main class="view">
            <div class="heading">
                <h1 class="title">Tools</h1>
                <p class="description">Calibration and debugging for the machine. Pick a tool with the joystick, Home inside a tool brings you back here.</p>
            </div>

            <ol class="tools js-tools"></ol>
        </main>

        <div class="footnote js-footnote"></div>

        <footer class="inputs">
            <div class="inputs-container js-inputs"></div>
        </footer>
    </div>

    <script type="module" src="/src/hub/hub.js"></script>
</body>
</html>
