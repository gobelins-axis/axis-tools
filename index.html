<!DOCTYPE html>
<html lang="en" data-theme="cabinet">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axis Tools</title>
    <script>
        // The launcher preload looks for window.__axis__ at DOMContentLoaded. The
        // real object is created when axis-api loads; this shim keeps the
        // ipcRenderer if the preload gets there first (see src/axis/axis.js).
        window.__axis__ = {
            set_ipc_renderer: function (ipcRenderer) { window.__axis_pending_ipc__ = ipcRenderer; },
        };
    </script>
</head>
<body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
